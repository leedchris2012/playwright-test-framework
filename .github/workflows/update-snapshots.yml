name: Update Snapshot Baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate snapshot baselines for this platform
        run: npx playwright test tests/snapshot --project=chromium --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/snapshot
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
          else
            git commit -m "test: update snapshot baselines (ubuntu-latest, $(date -u +%Y-%m-%d))"
            git push
          fi
